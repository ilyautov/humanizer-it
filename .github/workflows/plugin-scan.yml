# Security gate, HOL AI Plugin Scanner: a requirement of the awesome-codex-plugins
# catalog (score >= 80, no high/critical). Local run: pip install plugin-scanner
# && plugin-scanner lint .
name: plugin-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: hashgraph-online/ai-plugin-scanner-action@b427d0e5c30fa6ac4235aae37960dab0a3449538 # v1
