name: Publish to ClawHub

# OpenClaw skill registry: https://clawhub.ai
#
# Manual trigger only, never runs on commits.
# One-time setup, before the first real release:
#   1. clawhub.ai -> Sign in with GitHub
#   2. create a token in the web UI
#   3. add it under Settings -> Secrets and variables -> Actions
#      as CLAWHUB_TOKEN
# Without the token "preview" works and "publish" fails on auth.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview shows the plan, publish uploads to the registry
        type: choice
        options: [preview, publish]
        default: preview
      owner:
        description: >-
          Publisher handle on clawhub.ai. Needed when someone else
          already took the slug.
        type: string
        default: ""

jobs:
  clawhub:
    permissions:
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/skill-publish.yml@v0.24.0
    with:
      root: skills
      owner: ${{ inputs.owner }}
      dry_run: ${{ inputs.mode != 'publish' }}
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
