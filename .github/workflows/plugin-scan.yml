# Security gate, HOL AI Plugin Scanner: a requirement of the awesome-codex-plugins
# catalog (score >= 80, no high/critical). Local run: pip install plugin-scanner
# && plugin-scanner lint .
name: plugin-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58 # v1
